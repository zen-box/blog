# node_modules 用平铺布局（和 npm 一样，不用软链接）：Next.js 的 standalone 产物
# 才能完整带上 sharp 等原生模块；Windows 下 Turbopack 构建也不会因为目录联接出错
nodeLinker: hoisted

# 不需要运行安装脚本：better-sqlite3 自带各平台的预编译文件，
# esbuild 的二进制由对应平台的可选依赖提供
allowBuilds:
  better-sqlite3: false
  esbuild: false

minimumReleaseAgeExclude:
  - "@aws-sdk/client-s3@3.1143.0"
